name: Site Health

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required site files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            amazon-ai-picks.html
            anthbot-de.html
            anthbot-global.html
            bluefx-ai-media-machine-review.html
            contact.html
            eufy-picks.html
            eufy-security-camera-review.html
            guides.html
            fitness-tech.html
            colmi-r02-smart-ring-review.html
            amazfit-bip-5-smartwatch-review.html
            shokz-openrun-pro-2-review.html
            dji-osmo-action-4-review.html
            renpho-smart-jump-rope-review.html
            insta360-link-2-review.html
            plaud-notepin-review.html
            privacy.html
            reels.html
            roborock-review.html
            terms.html
            translation-earbuds-review.html
            styles.css
            script.js
            404.html
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
      - name: Verify all HTML links, assets and analytics
        run: python3 scripts/check_site_links.py

  verify-live-pages:
    # Pages deployment is asynchronous; scheduled/manual runs check the live site.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check published GitHub Pages URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://ndubiz.github.io/ai-gear-hub'
          pages=(
            '/'
            '/amazon-ai-picks.html'
            '/anthbot-de.html'
            '/anthbot-global.html'
            '/bluefx-ai-media-machine-review.html'
            '/contact.html'
            '/eufy-picks.html'
            '/eufy-security-camera-review.html'
            '/guides.html'
            '/fitness-tech.html'
            '/colmi-r02-smart-ring-review.html'
            '/amazfit-bip-5-smartwatch-review.html'
            '/shokz-openrun-pro-2-review.html'
            '/dji-osmo-action-4-review.html'
            '/renpho-smart-jump-rope-review.html'
            '/insta360-link-2-review.html'
            '/plaud-notepin-review.html'
            '/privacy.html'
            '/reels.html'
            '/roborock-review.html'
            '/terms.html'
            '/translation-earbuds-review.html'
          )
          failed=0
          for page in "${pages[@]}"; do
            url="${base}${page}"
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 45 "$url" || true)
            echo "$code  $url"
            if [[ ! "$code" =~ ^[23][0-9][0-9]$ ]]; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Detect stale published content
        shell: bash
        run: |
          set -euo pipefail
          base='https://ndubiz.github.io/ai-gear-hub'
          home=$(curl -L -sS --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 45 "${base}/")
          plaud=$(curl -L -sS --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 45 "${base}/plaud-notepin-review.html")
          grep -Fq 'Six useful starting points—not the entire catalogue.' <<< "$home" || {
            echo 'Live homepage is reachable but stale: current concise homepage marker was not found.'
            exit 1
          }
          grep -Fq 'Plaud NotePin S vs NotePin' <<< "$plaud" || {
            echo 'Live Plaud page is reachable but stale: NotePin S refresh marker was not found.'
            exit 1
          }
          echo 'Live content matches the current maintained source.'
